<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Course Portal - Bilal Rajput</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <h1>🚀 Web Development Learning Portal</h1>
            <button class="theme-toggle" id="themeToggleBtn">☀️ Light Mode</button>
        </div>
        <p>Bilal Rajput's Personal Lecture Notes & Study Guide</p>
        
        <div class="controls-bar">
            <div class="stats">
                Completed: <strong id="completedCount">1</strong> / 50 Lectures
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search lecture number (e.g. lecture 5)...">
            </div>
        </div>
    </header>

    <main>
        <h2>📚 Select a Lecture to Access</h2>
        <div class="lecture-grid" id="lectureGrid">
            
            <!-- Lecture 01 (Active) -->
            <a href="lec-1.html" class="card" data-title="lecture 1 web fundamentals html basics">
                <div class="card-header">
                    <span class="card-tag completed">Lecture 01</span>
                    <span class="status-icon">✅</span>
                </div>
                <h3>Lecture 01</h3>
                <p>Web Development Fundamentals, WWW, Internet vs Web, and HTML Basics.</p>
            </a>

            <!-- Lectures 02 to 50 Generated Automatically via HTML Links -->
            <script>
                for (let i = 2; i <= 50; i++) {
                    let numStr = i < 10 ? '0' + i : i;
                    document.write(`
                        <a href="lec-${i}.html" class="card upcoming-card" data-title="lecture ${i}" data-lecture-name="Lecture ${numStr}">
                            <div class="card-header">
                                <span class="card-tag upcoming">Lecture ${numStr}</span>
                                <span class="status-icon">⏳</span>
                            </div>
                            <h3>Lecture ${numStr}</h3>
                            <p>Detailed notes, practical code examples, and Roman Urdu explanation for lecture ${i}.</p>
                        </a>
                    `);
                }
            </script>

        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
